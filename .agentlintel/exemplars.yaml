# SPDX-License-Identifier: Apache-2.0
#
# AGENTLINTEL v2 exemplar registry. Agents mirror a registered exemplar
# instead of extrapolating from training data. If no exemplar matches the
# shape of the task, the agent must STOP and ask a human to nominate one.
# `agentlintel verify` checks every path below exists.

version: 2

exemplars:
  - id: explain-command
    shape: cli-command
    path: tools/agentlintel-cli/src/commands/explain.js
    demonstrates: "Read-only command logic, explicit result data, and separate rendering."
  - id: rule-engine
    shape: rule-engine
    path: tools/agentlintel-cli/src/lib/engines.js
    demonstrates: "Pure deterministic rule evaluation, prepared configuration, and explicit violation data."
  - id: rule-engine-test
    shape: rule-engine-test
    path: tools/agentlintel-cli/test/engines.test.js
    demonstrates: "Node test cases with inline rule configuration and exact violation assertions."
  - id: cli-command-test
    shape: cli-command-test
    path: tools/agentlintel-cli/test/cli.test.js
    demonstrates: "CLI argument, JSON output, and human-readable rendering assertions."
  - id: agent-skill
    shape: agent-skill
    path: .agents/skills/audit-architecture/SKILL.md
    demonstrates: "Concise Agent Skill frontmatter with an imperative, evidence-bounded workflow."
  - id: dotnet-sarif-adapter
    shape: external-engine-adapter
    path: tools/agentlintel-cli/templates/engine-adapters/dotnet-sarif.js
    demonstrates: "Dependency-free native-tool wrapper: temporary evidence, fail-closed execution, SARIF merge, and repository-relative locations."
