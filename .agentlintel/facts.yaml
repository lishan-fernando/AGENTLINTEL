# SPDX-License-Identifier: Apache-2.0
#
# AGENTLINTEL v2 facts. LAW: every fact carries a machine check and is
# re-verified on every `agentlintel verify` run. A fact without a passing
# check is a build failure, not a stale comment.
#
# Check types:
#   path_exists   - path must exist relative to repo root
#   file_contains - file must match regex pattern
#   command       - command must exit with expect_exit (default 0)

version: 2

facts:
  - id: cli-entry
    claim: "The CLI entry point is tools/agentlintel-cli/bin/agentlintel.js"
    check: { type: path_exists, path: tools/agentlintel-cli/bin/agentlintel.js }

  - id: cli-node-engine
    claim: "The CLI requires Node >= 18, no build step"
    check: { type: file_contains, path: tools/agentlintel-cli/package.json, pattern: "\"node\":\\s*\">=18\"" }

  - id: cli-no-build-script
    claim: "The CLI ships reviewable source directly and has no build script"
    check: { type: file_contains, path: tools/agentlintel-cli/package.json, pattern: "^(?![\\s\\S]*\"build\"\\s*:)[\\s\\S]*\"scripts\"\\s*:" }

  - id: cli-single-runtime-dependency
    claim: "The CLI has exactly one runtime dependency: yaml"
    check: { type: file_contains, path: tools/agentlintel-cli/package.json, pattern: "\"dependencies\"\\s*:\\s*\\{\\s*\"yaml\"\\s*:\\s*\"[^\"]+\"\\s*\\}" }

  - id: verifier-orchestration-lines
    claim: "Verifier orchestration stays within 3,200 lines; cohesive responsibilities live in focused lib modules"
    check: { type: line_count_max, path: tools/agentlintel-cli/src/lib/verify.js, max: 3200 }

  - id: rules-kernel
    claim: "Deterministic rules live in .agentlintel/rules.yaml (v2 format)"
    check: { type: file_contains, path: .agentlintel/rules.yaml, pattern: "version: 2" }

  - id: conformance-fixtures
    claim: "Every rule has pass/fail fixtures under .agentlintel/conformance/<rule-id>/"
    check: { type: path_exists, path: .agentlintel/conformance/CONFORMANCE.md }

  - id: skill-strangler-extraction
    claim: "The monolith extraction playbook ships as a standard Agent Skill"
    check: { type: file_contains, path: .agents/skills/strangler-extraction/SKILL.md, pattern: "^---\\r?\\nname: strangler-extraction\\r?\\ndescription: [^\\r\\n]+\\r?\\n---" }

  - id: skill-mirror-exemplar
    claim: "Exemplar-mirroring workflow ships as a standard Agent Skill"
    check: { type: file_contains, path: .agents/skills/mirror-exemplar/SKILL.md, pattern: "^---\\r?\\nname: mirror-exemplar\\r?\\ndescription: [^\\r\\n]+\\r?\\n---" }

  - id: skill-audit-architecture
    claim: "The architecture audit workflow ships as a standard Agent Skill"
    check: { type: file_contains, path: .agents/skills/audit-architecture/SKILL.md, pattern: "^---\\r?\\nname: audit-architecture\\r?\\ndescription: [^\\r\\n]+\\r?\\n---" }

  - id: skill-scope-change
    claim: "The token-bounded change-scoping workflow ships as a standard Agent Skill"
    check: { type: file_contains, path: .agents/skills/scope-change/SKILL.md, pattern: "^---\\r?\\nname: scope-change\\r?\\ndescription: [^\\r\\n]+\\r?\\n---" }

  - id: skill-prove-stateful-workflow
    claim: "The held-out stateful-workflow proof ships as a standard Agent Skill"
    check: { type: file_contains, path: .agents/skills/prove-stateful-workflow/SKILL.md, pattern: "^---\\r?\\nname: prove-stateful-workflow\\r?\\ndescription: [^\\r\\n]+\\r?\\n---" }

  - id: spec
    claim: "The framework spec is SPEC.md at repo root (<= 500 lines)"
    check: { type: line_count_max, path: SPEC.md, max: 500 }

  # The framework's own budgets, machine-checked ("budgets without measurement
  # are wishes" was v1's post-mortem). ~8KB = ~2K tokens at ~4 bytes/token.
  - id: agents-md-lines
    claim: "AGENTS.md stays within the always-load budget (<= 150 lines)"
    check: { type: line_count_max, path: AGENTS.md, max: 150 }

  - id: agents-md-bytes
    claim: "AGENTS.md uses at most 7KB of the 8KB approximate always-load budget"
    check: { type: byte_count_max, path: AGENTS.md, max: 7168 }

  - id: agent-loop-lean-recipe
    claim: "The documented agent loop stays token-lean: diff-scoped, quiet, bailing, no dynamic runs, fixtures skipped"
    check: { type: file_contains, path: AGENTS.md, pattern: "verify --diff --quiet --bail --no-run --skip-fixtures" }

  - id: adopter-template-lean-recipe
    claim: "The adopter AGENTS template teaches the token-lean verify loop and explain-first context"
    check: { type: file_contains, path: tools/agentlintel-cli/templates/AGENTS.template.md, pattern: "verify --diff --quiet --bail --no-run --skip-fixtures" }

  - id: skill-frontmatter-bytes
    claim: "All standard skill frontmatters share the remaining 1KB always-load budget"
    check: { type: frontmatter_byte_count_max, pattern: ".agents/skills/*/SKILL.md", max: 1024 }

  - id: three-skills
    claim: "Exactly the five reference skills ship - concept creep is a bug"
    check: { type: glob_count, pattern: ".agents/skills/*/SKILL.md", min: 5, max: 5 }

  - id: no-root-package-lock
    claim: "The repo root is a script wrapper, not an npm workspace install root; dependency locking lives in tools/agentlintel-cli/package-lock.json"
    check: { type: file_absent, path: package-lock.json }

  - id: stable-doc-filenames
    claim: "Living docs use stable semantic filenames; dates and release versions stay in changelog content, tags, or ADR history"
    check: { type: glob_count, pattern: "docs/*202*.md", max: 0 }

  - id: no-leading-version-docs
    claim: "Living docs do not use product-version prefixes in filenames"
    check: { type: glob_count, pattern: "docs/V*.md", max: 0 }

  - id: no-versioned-test-filenames
    claim: "CLI test files are named for behavior, not product versions"
    check: { type: glob_count, pattern: "tools/agentlintel-cli/test/v*-*.test.js", max: 0 }

  - id: v1-split-doc-deleted
    claim: "The stale v1 REPOSITORY-SPLIT.md stays deleted (verified, append-only, or deleted)"
    check: { type: file_absent, path: REPOSITORY-SPLIT.md }

  # The legal surface is governance too - machine-checked like everything else (ADR-020).
  - id: license-core
    claim: "The core uses the AgentLintel Free Use No-Resale License; LICENSE carries the canonical text"
    check: { type: file_contains, path: LICENSE, pattern: "LicenseRef-AgentLintel-Free-Use-No-Resale-1\\.0" }

  - id: license-adoption-surface
    claim: "AgentLintel-supplied adoption templates and this repo's adoption examples stay Apache-2.0; adopter-authored project files keep the adopter's terms"
    check: { type: file_contains, path: tools/agentlintel-cli/LICENSE-APACHE, pattern: "Apache License" }

  - id: single-root-license-file
    claim: "Only the primary repo LICENSE stays at the root; secondary legal docs live below docs/ or the package"
    check: { type: file_absent, path: LICENSE-APACHE }

  - id: root-license-policy-moved
    claim: "The license boundary map lives at docs/LEGAL.md, not as a second root license tab"
    check: { type: file_absent, path: LICENSE-POLICY.md }
