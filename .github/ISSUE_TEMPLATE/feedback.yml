name: Public feedback
description: Share a sanitized drift story, bug, or docs feedback.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing AgentLintel early. Do not paste secrets, customer
        data, private source code, private logs, or sensitive adoption context.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - Architecture drift report
        - Bug report
        - Docs feedback
        - Other public feedback
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Share only public, sanitized details: what drifted, what failed, or what was unclear.
      placeholder: "Example: Agents keep bypassing public slice indexes in a TypeScript monorepo."
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public safety check
      options:
        - label: I did not include secrets, customer data, private source code, private logs, or sensitive adoption context.
          required: true
