# SPDX-License-Identifier: Apache-2.0
#
# Keeps the supply chain current: commit-SHA action pins in workflows and the
# composite action, plus the CLI's single runtime dependency and its lockfile.
# One grouped PR per ecosystem per week; the merge gate does the judging.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/.github/actions/agentlintel"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/tools/agentlintel-cli"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
