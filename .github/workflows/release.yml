# SPDX-License-Identifier: Apache-2.0
#
# Release pipeline (ADR-013): push a tag like v2.0.0-alpha.5 and adopters can
# install the CLI the same day - no npm account required. The tarball (plus
# sha256) attaches to the GitHub Release under a STABLE name:
#
#   npm i -D https://github.com/lishan-fernando/AGENTLINTEL/releases/latest/download/agentlintel-cli.tgz
#
# This replaces vendored framework clones - the mechanism that stranded both
# production workspaces on v1. npm publishing is an explicit decision: it
# runs iff the repository variable NPM_PUBLISH is "true", always with
# provenance. Auth: NPM_TOKEN secret (first-publish bootstrap) or GitHub
# OIDC trusted publishing (tokenless). Runbook: docs/PUBLISHING.md.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write # npm provenance + tokenless trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Publish credentials are scoped to this deployment environment
    # (restricted to v* tags), not the whole repository.
    environment: NPM
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install CLI dependencies (from lockfile)
        run: npm ci --no-audit --no-fund --prefix tools/agentlintel-cli

      - name: Tag must match package version
        run: |
          PKG="v$(node -p "require('./tools/agentlintel-cli/package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME != package version $PKG - bump package.json first."
            exit 1
          fi

      - name: Gate must be green to release
        run: |
          npm test --prefix tools/agentlintel-cli
          node tools/agentlintel-cli/bin/agentlintel.js verify --dir . --strict

      - name: Package shape smoke test
        working-directory: tools/agentlintel-cli
        run: |
          chmod +x bin/agentlintel.js
          npm pack --dry-run --json

      - name: Pack tarball + checksum
        run: |
          cd tools/agentlintel-cli
          chmod +x bin/agentlintel.js
          npm pack
          mv agentlintel-cli-*.tgz agentlintel-cli.tgz
          sha256sum agentlintel-cli.tgz > agentlintel-cli.tgz.sha256
          cat agentlintel-cli.tgz.sha256

      - name: Create GitHub Release with tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            tools/agentlintel-cli/agentlintel-cli.tgz \
            tools/agentlintel-cli/agentlintel-cli.tgz.sha256 \
            --title "AgentLintel $GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" \
            tools/agentlintel-cli/agentlintel-cli.tgz \
            tools/agentlintel-cli/agentlintel-cli.tgz.sha256 \
            --clobber

      - name: Publish to npm with provenance
        if: vars.NPM_PUBLISH == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm >= 11.5.1 for OIDC trusted publishing; node 24 bundles 11.x
          # but the floor is pinned explicitly rather than assumed.
          npm install -g npm@11 --no-audit --no-fund
          npm --version
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Auth: granular automation token (bootstrap path)."
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
          else
            echo "Auth: GitHub OIDC trusted publishing (tokenless)."
          fi
          cd tools/agentlintel-cli
          # npm refuses to let a prerelease default to the `latest` dist-tag;
          # alpha/beta/rc publish under their prerelease identifier.
          VERSION="$(node -p "require('./package.json').version")"
          DIST_TAG="${VERSION#*-}"
          if [ "$DIST_TAG" = "$VERSION" ]; then DIST_TAG="latest"; else DIST_TAG="${DIST_TAG%%.*}"; fi
          echo "Publishing $VERSION with dist-tag $DIST_TAG"
          npm publish --access public --provenance --tag "$DIST_TAG"

      - name: npm publish skipped
        if: vars.NPM_PUBLISH != 'true'
        run: |
          echo "Repository variable NPM_PUBLISH is not 'true' - skipping the npm registry."
          echo "The tarball release is live. To enable npm publishing, follow docs/PUBLISHING.md."
